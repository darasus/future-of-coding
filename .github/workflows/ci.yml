name: CI

# Every push to main, which is what a merge is, and every pull request: a
# change is checked before it lands and again once it has.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # This type-checks and bundles the app; it does not package or run it, so
    # nothing here needs macOS. Linux runners start sooner and, for a private
    # repository, use a tenth of the minutes a macOS runner does.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # The pnpm version pnpm-lock.yaml was written with.
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
