name: Release

# Tag a commit `vX.Y.Z` (matching package.json) to build the macOS app and publish a GitHub
# Release. Installed copies find the release and update themselves from it. The signing secrets
# are optional (see README, Releasing): without them the build is signed ad hoc, which runs but
# cannot update itself, because macOS only lets a properly signed app be replaced in place.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft once, up front, so the build has one release to add its files to.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Future of AI Interface $VERSION" --generate-notes

  macos:
    needs: prepare
    # Apple silicon, which is the one platform the app is built for: the Agent SDK installs the
    # Claude Code program for the machine it is installed on.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # The pnpm version pnpm-lock.yaml was written with.
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # An empty CSC_LINK makes electron-builder try to open "" as a certificate file, so
          # drop the signing variables entirely when the secrets are not configured.
          NOTARIZE=false
          SIGN_ARGS=()
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            NOTARIZE=true
            # Import the certificate into our own keychain rather than letting electron-builder do
            # it: 26.x unlocks its keychain with the .p12 password in set-key-partition-list, which
            # fails with "The user name or passphrase you entered is not correct".
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            base64 --decode <<<"$CSC_LINK" >"$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then
              echo "No valid Developer ID Application identity in MAC_CSC_LINK" >&2
              exit 1
            fi
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$KEYCHAIN" CSC_NAME="$IDENTITY"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Sign ad hoc instead. Left unsigned, the bundle's signature is broken and Apple silicon
            # reports the app as "damaged"; ad hoc, the user can approve it in Privacy & Security.
            # Hardened runtime only matters for notarization, and ad hoc it needs extra entitlements.
            SIGN_ARGS=(--config.mac.identity=- --config.mac.hardenedRuntime=false)
          fi
          pnpm typecheck
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --publish always --config.mac.notarize=$NOTARIZE "${SIGN_ARGS[@]}"

  publish:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
